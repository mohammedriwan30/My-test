---
- name: Automate System Configuration Backup on Rocky Linux VMs
  hosts: all
  become: yes
  tasks:

    - name: Ensure the destination backup directory exists
      ansible.builtin.file:
        path: /root/backup
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Compress /etc directory into a timestamped tar archive
      ansible.builtin.archive:
        path: /etc
        dest: "/root/backup/etc_backup_{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
        format: gz
        owner: root
        group: root
        mode: '0600'

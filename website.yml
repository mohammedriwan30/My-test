---
- name: Deploy and Configure Web Servers on Rocky Linux VMs
  hosts: all
  become: yes
  vars:
    # BIND DEFINITION VALUE: Set to 'nginx' or 'httpd' (Apache) as desired
    web_server_package: nginx

  tasks:
    - name: Ensure the EPEL repository is present (Required for Nginx)
      dnf:
        name: epel-release
        state: present
      when: web_server_package == 'nginx'

    - name: Install the designated web server package
      dnf:
        name: "{{ web_server_package }}"
        state: present
        update_cache: yes

    - name: Start and enable the web server system daemon
      systemd:
        name: "{{ web_server_package }}"
        state: started
        enabled: yes

    - name: Configure local firewalld rules for web traffic
      firewalld:
        service: http
        permanent: yes
        state: enabled
        immediate: yes

    - name: Create the base web root layout path if missing
      file:
        path: /var/www/html
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: web_server_package == 'nginx'

    - name: Deploy a structural template index webpage asset
      copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Rocky Linux Web Node</title>
              <style>
                  body { font-family: Arial, sans-serif; text-align: center; margin-top: 80px; background-color: #eceff4; color: #2e3440; }
                  h1 { color: #5e81ac; }
                  .badge { background-color: #81a1c1; color: white; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
              </style>
          </head>
          <body>
              <h1>Automation Success!</h1>
              <p>Active Engine Web Server Wrapper Instance: <span class="badge">{{ web_server_package | upper }}</span></p>
              <p>Node Target Hostname: {{ inventory_hostname }}</p>
          </body>
          </html>
        dest: "{{ '/usr/share/nginx/html/index.html' if web_server_package == 'nginx' else '/var/www/html/index.html' }}"
        mode: '0644'

    - name: Setup dynamic Nginx routing block patch if package is selected
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: 'root\s+/usr/share/nginx/html;'
        line: '        root /usr/share/nginx/html; # Managed by Ansible'
      when: web_server_package == 'nginx'
      notify: Reload Web Server Daemon

  handlers:
    - name: Reload Web Server Daemon
      systemd:
        name: "{{ web_server_package }}"
        state: reloaded
